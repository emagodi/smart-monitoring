server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Auth Service
    location /auth-service {
        proxy_pass http://auth-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Rewrite path if needed (e.g., if auth-service expects /api/v1/auth instead of /auth-service/api/v1/auth)
        # But usually service discovery handles this or the service context path matches.
        # Assuming context path matches /auth-service or is root. Let's start with simple proxy_pass.
        # If the backend services are Spring Boot apps, they might be running on root context path '/'.
        # If so, we need to rewrite.
        # Let's check application.properties of auth-service and transformer-service to be sure.
        # For now, I'll assume they might need rewriting.
        rewrite ^/auth-service/(.*) /$1 break;
    }

    # Proxy Transformer Service
    location /transformer-service {
        proxy_pass http://transformer-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        rewrite ^/transformer-service/(.*) /$1 break;
    }

    # Proxy Notification Service
    location /notification-service {
        proxy_pass http://notification-service:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        rewrite ^/notification-service/(.*) /$1 break;
    }

    # Optional: Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

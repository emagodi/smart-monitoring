spring.application.name=transformer-service
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.main.allow-bean-definition-overriding=true

# Local H2 Configuration (Bypass MySQL)
server.port=8083
spring.datasource.url=jdbc:h2:mem:tms;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jackson.time-zone=Africa/Harare

# Vision AI Local URL
vision.ai.url=http://localhost:8000

# Eureka (Disabled for Local Run)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Swagger
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/transformer/v3/api-docs
springdoc.swagger-ui.config-url=/transformer/v3/api-docs/swagger-config

# WebSocket Configuration (Mocked)
loriot.ws.url=wss://mock
powertel.ws.url=wss://mock

# Fallback JWT Configuration
application.security.jwt.secret-key=w7rj85o9SnDk1q2W8gHixMfNYaW6mDpcFXH0f1RmZDU=
application.security.jwt.expiration=18000000
application.security.jwt.cookie-name=jwt-cookie

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: tms
      TZ: Africa/Harare
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - mysql

  config-server:
    build: ./config-server
    container_name: config-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config
      TZ: Africa/Harare
      JAVA_TOOL_OPTIONS: -Duser.timezone=Africa/Harare
    volumes:
      - ./config:/config:ro
    ports:
      - "8888:8888"
    depends_on:
      - mysql

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    restart: unless-stopped
    environment:
      TZ: Africa/Harare
      JAVA_TOOL_OPTIONS: -Duser.timezone=Africa/Harare
    ports:
      - "8761:8761"
    depends_on:
      - config-server

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka
      TZ: Africa/Harare
      JAVA_TOOL_OPTIONS: -Duser.timezone=Africa/Harare
    ports:
      - "8082:8082"
    volumes:
      - ./uploads:/uploads/monitor
    depends_on:
      - mysql
      - eureka-server
      - config-server

  transformer-service:
    build: ./transformer-service
    container_name: transformer-service
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka
      LORIOT_WS_URL: ${LORIOT_WS_URL}
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka
      TZ: Africa/Harare
      JAVA_TOOL_OPTIONS: -Duser.timezone=Africa/Harare
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - eureka-server
      - config-server

    
  gateway:
    build: ./gateway
    container_name: api-gateway
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka
      TZ: Africa/Harare
      JAVA_TOOL_OPTIONS: -Duser.timezone=Africa/Harare
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server

volumes:
  mysql_data:
# Upgrade header only when the browser asks for a WebSocket; plain requests keep the upstream connection alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Re-use connections to the API gateway instead of opening a new TCP connection per request.
upstream api_gateway {
    server api-gateway:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ---- compression: JS/CSS/JSON shrink 70-85% on the wire
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml font/ttf font/otf;

    # ---- built JS/CSS have a content hash in the name: cache them for a year, never re-download
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- the app shell must always be fresh so a new deployment is picked up at once
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API through the gateway
    location ^~ /api {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # Keep service-specific proxies just in case frontend uses them
    location ^~ /auth-service {
        proxy_pass http://auth-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        rewrite ^/auth-service/(.*) /$1 break;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location ^~ /transformer-service {
        proxy_pass http://transformer-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        rewrite ^/transformer-service/(.*) /$1 break;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location ^~ /notification-service {
        proxy_pass http://notification-service:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        rewrite ^/notification-service/(.*) /$1 break;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # Other static files (logos, icons, fonts in /public): cache a week
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

eureka.client.service-url.defaultZone=${EUREKA_URI:http://eureka-server:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Auth Service Routes ---

# 1. Auth API
spring.cloud.gateway.routes[0].id=auth-api
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

# 2. Infrastructure (Regions, Districts, Depots)
spring.cloud.gateway.routes[1].id=regions
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/regions/**

spring.cloud.gateway.routes[2].id=districts
spring.cloud.gateway.routes[2].uri=lb://auth-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/districts/**

spring.cloud.gateway.routes[3].id=depots
spring.cloud.gateway.routes[3].uri=lb://auth-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/depots/**

# 3. Users
spring.cloud.gateway.routes[4].id=users
spring.cloud.gateway.routes[4].uri=lb://auth-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/users/**

# --- Transformer Service Routes ---

# 4. Transformers
spring.cloud.gateway.routes[5].id=transformers
spring.cloud.gateway.routes[5].uri=lb://transformer-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/transformers/**

# 5. Sensors & Readings
spring.cloud.gateway.routes[6].id=sensors
spring.cloud.gateway.routes[6].uri=lb://transformer-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/sensors/**

# 6. Oculus Control
spring.cloud.gateway.routes[7].id=oculus-control
spring.cloud.gateway.routes[7].uri=lb://transformer-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/oculus-control/**

# --- Legacy/Convenience Routes (Optional) ---
# Map /auth/** to /api/v1/auth/** for backward compatibility if needed
spring.cloud.gateway.routes[8].id=auth-legacy
spring.cloud.gateway.routes[8].uri=lb://auth-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/auth/(?<segment>.*),/api/v1/auth/$\{segment}

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.'[/**]'.allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.'[/**]'.allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.'[/**]'.allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.'[/**]'.exposedHeaders=Authorization

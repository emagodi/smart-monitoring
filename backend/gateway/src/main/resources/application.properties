server.port=8080

spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true

# Explicit routes for friendly prefixes
spring.cloud.gateway.routes[0].id=transformer
spring.cloud.gateway.routes[0].uri=lb://transformer-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/transformer/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=auth
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/auth/(?<segment>.*),/api/v1/auth/$\{segment}

# API Routes for Auth Service (Auth & Infrastructure)
spring.cloud.gateway.routes[2].id=api-auth-svc
spring.cloud.gateway.routes[2].uri=lb://auth-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[3].id=api-regions
spring.cloud.gateway.routes[3].uri=lb://auth-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/regions/**

spring.cloud.gateway.routes[4].id=api-districts
spring.cloud.gateway.routes[4].uri=lb://auth-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/districts/**

spring.cloud.gateway.routes[5].id=api-depots
spring.cloud.gateway.routes[5].uri=lb://auth-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/depots/**

spring.cloud.gateway.routes[6].id=api-admin
spring.cloud.gateway.routes[6].uri=lb://auth-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/admin/**

# API Routes for Transformer Service (Everything else)
spring.cloud.gateway.routes[7].id=api-transformer-catchall
spring.cloud.gateway.routes[7].uri=lb://transformer-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/**

spring.cloud.gateway.httpclient.connect-timeout=60000
spring.cloud.gateway.httpclient.response-timeout=60s

